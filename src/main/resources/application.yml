spring:
  application:
    name: digital-banking
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    import: optional:file:.env[.properties]
    
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: banking-pool
      maximum-pool-size: 5          # Neon free tier has limited connections
      minimum-idle: 0               # Neon scales compute to zero when idle
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000
      initialization-fail-timeout: 60000   # tolerate Neon cold start on boot

  jpa:
    open-in-view: false             # no lazy loading from the web layer
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
        "[default_batch_fetch_size]": 16

  flyway:
    enabled: true
    # Optional separate (direct) connection for migrations. Defaults to the main datasource.
    url: ${DB_MIGRATION_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:3500}
  shutdown: graceful
    

# Structured (JSON/ECS) logging is built into Spring Boot. MDC + key/values are emitted automatically.
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    "[tutorjava.digitalbanking]": INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

app:
  jwt:
    secret: ${JWT_SECRET}                 # base64, >= 32 bytes
    issuer: digital-banking-api
    access-token-expiration: 15m
  refresh-token:
    ttl: 7d                      # sliding: renewed on every refresh
    absolute-ttl: 30d            # hard cap per login session
    cookie-name: refresh_token
    cookie-path: /api/v1/auth    # cookie is only sent to the auth endpoints
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}          # false only for plain-http local dev (e.g. Safari)
    cookie-same-site: ${REFRESH_COOKIE_SAMESITE:Strict}   # None if the web frontend is on another site (needs secure=true)
  auth:
    max-failed-login-attempts: 5
    lock-duration: 15m
  banking:
    currency: IDR
    max-transaction-amount: 50000000.00
    max-accounts-per-user: 5
  idempotency:
    ttl: 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}